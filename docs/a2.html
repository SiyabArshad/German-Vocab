<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>German A2 Vocabulary Trainer (450 Fixed)</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
header{background:#111827;color:#fff;padding:16px;text-align:center}
.container{max-width:1200px;margin:auto;padding:16px}
.controls{display:flex;gap:10px;margin-bottom:10px}
input,select{padding:8px}
.stats{display:flex;gap:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:#fff;padding:10px;border-radius:8px}
.word{font-weight:bold}
.tag{font-size:12px;background:#ddd;padding:2px 6px;border-radius:4px}
</style>
</head>

<body>

<header>
<h2>German A2 Vocabulary Trainer (450 Fixed Dataset)</h2>
</header>

<div class="container">

<div class="controls">
<input id="search" placeholder="Search..."/>
<select id="filter">
<option value="all">All</option>
<option value="noun">Nouns</option>
<option value="verb">Verbs</option>
<option value="adjective">Adjectives</option>
<option value="other">Other</option>
</select>
</div>

<div class="stats">
<div>Nouns: <span id="n"></span></div>
<div>Verbs: <span id="v"></span></div>
<div>Adjectives: <span id="a"></span></div>
<div>Other: <span id="o"></span></div>
<div>Total: <span id="t"></span></div>
</div>

<div class="grid" id="grid"></div>

</div>

["der Tee","tea"],["das Brot","bread"],["das Fleisch","meat"],["das Gemüse","vegetables"],
["das Obst","fruit"],["die Milch","milk"],["der Zucker","sugar"],["das Salz","salt"],
["die Butter","butter"],["das Geld","money"],["der Preis","price"],["die Karte","card"],

["die Freiheit","freedom"],["die Sicherheit","security"],["die Kommunikation","communication"],
["die Information","information"],["die Entwicklung","development"],["die Forschung","research"],
["die Produktion","production"],["die Kontrolle","control"],["die Organisation","organization"],

["entscheiden","to decide"],["entwickeln","to develop"],["vergleichen","to compare"],
["reduzieren","to reduce"],["erhöhen","to increase"],["kontrollieren","to control"],
["installieren","to install"],["speichern","to save"],["laden","to load"],

["empfangen","to receive"],["prüfen","to check"],["analysieren","to analyze"],

["verbinden","connect"],["unterstützen","support"],["entwickeln","develop"],

["klar","clear"],["stabil","stable"],["instabil","unstable"],
["digital","digital"],["analog","analog"],["effizient","efficient"],
["flexibel","flexible"],["aktiv","active"],["passiv","passive"],
["strategisch","strategic"],["praktisch","practical"],["logisch","logical"],

["politisch","political"],["wirtschaftlich","economic"],["kulturell","cultural"],

["falls","in case"],["sofern","provided that"],["sobald","as soon as"],
["deswegen","therefore"],["somit","thus"],["außer","except"],
["innerhalb","within"],["außerhalb","outside"],["trotz","despite"],
["wegen","because of"],["bezüglich","regarding"],["laut","according to"],
["anstatt","instead of"],["inklusive","including"],["exklusiv","excluding"],
["mindestens","at least"],["höchstens","at most"]
],"other");

/* ===================== CORE ===================== */
let vocab=[...nouns,...verbs,...adjectives,...other];

const grid=document.getElementById("grid");

function stats(){
  const c={noun:0,verb:0,adjective:0,other:0};
  vocab.forEach(x=>c[x.c]++);
  n.textContent=c.noun;
  v.textContent=c.verb;
  a.textContent=c.adjective;
  o.textContent=c.other;
  t.textContent=vocab.length;
}

function render(){
  const q=search.value.toLowerCase();
  const f=filter.value;
  grid.innerHTML="";
  vocab.filter(x=>(f==="all"||x.c===f)&&x.w.includes(q))
  .forEach(x=>{
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`<div class="word">${x.w}</div><div>${x.e}</div><div class="tag">${x.c}</div>`;
    grid.appendChild(d);
  });
}

search.oninput=()=>{stats();render()};
filter.onchange=()=>{stats();render()};

stats();render();
</script>

</body>
</html>
